name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    name: Lint, check and build (Node ${{ matrix.node }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      # Kept at `false` to report failures on all versions
      fail-fast: false
      matrix:
        node:
          - 24
          - 26
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep this in step with the publish and deploy workflows.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check types
        run: pnpm check
      - name: Build
        run: pnpm build
